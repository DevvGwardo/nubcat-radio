<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#9ecdff">
<title>nubcat radio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --color-brand: #6bb1ff;
  --color-brand-soft: #9ecdff;
  --color-brand-tint: #b7d9fe;
  --color-brand-mist: #eef4ff;
  --color-brand-deep: #2f7ed8;
  --color-brand-mid: #4d97f0;
  --color-accent: #ffc0d8;
  --color-ink: #1a3d6b;
  --color-ink-soft: #4f5b73;
  --color-mute: #6c7a93;
  --color-surface: #ffffff;
  --color-surface-soft: #f7faff;
  --color-border: #e5edfa;
  --color-ok: #34c77b;
  --radius-sm: 8px; --radius-md: 12px; --radius-lg: 14px; --radius-xl: 20px; --radius-pill: 999px;
  --shadow-card: 0 12px 32px rgba(108, 178, 255, 0.10);
  --shadow-button: 0 6px 16px rgba(108, 178, 255, 0.35);
  --shadow-bar: 0 -6px 24px rgba(108, 178, 255, 0.08);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Poppins", sans-serif;
  background: var(--color-brand-soft);
  color: var(--color-ink);
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background-image: radial-gradient(ellipse at 20% 0%, rgba(255,192,216,0.3) 0%, transparent 50%),
                    radial-gradient(ellipse at 80% 100%, rgba(107,177,255,0.15) 0%, transparent 50%);
}
.app {
  width: 100%;
  max-width: 480px;
  background: var(--color-surface);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-card);
  overflow: hidden;
  padding: 24px 20px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.header h1 {
  font-size: 22px;
  font-weight: 700;
  color: var(--color-brand-deep);
  letter-spacing: -0.3px;
}
.header h1 span { color: var(--color-ink); font-weight: 400; }
.badge {
  background: var(--color-brand-mist);
  color: var(--color-brand-deep);
  font-size: 11px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: var(--radius-pill);
  white-space: nowrap;
}
.now-playing {
  background: linear-gradient(150deg, var(--color-brand-deep) 0%, var(--color-brand) 55%, #5aa7ec 100%);
  border-radius: var(--radius-lg);
  padding: 20px;
  color: white;
  position: relative;
  overflow: hidden;
}
.now-playing::before {
  content: '';
  position: absolute;
  top: -20px; right: -20px;
  width: 100px; height: 100px;
  background: radial-gradient(circle, rgba(255,192,216,0.4), transparent);
  border-radius: 50%;
  pointer-events: none;
}
.np-genre {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  opacity: 0.8;
  margin-bottom: 8px;
}
.np-title {
  font-size: 20px;
  font-weight: 700;
  line-height: 1.2;
  position: relative;
  z-index: 1;
  text-shadow: 0 1px 3px rgba(0,0,0,0.15);
}
.np-sub {
  font-size: 13px;
  opacity: 0.75;
  margin-top: 4px;
  position: relative;
  z-index: 1;
}
.progress-bar {
  margin-top: 16px;
  height: 4px;
  background: rgba(255,255,255,0.2);
  border-radius: 2px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--color-accent), #fff);
  border-radius: 2px;
  transition: width 0.3s linear;
}
.time-row {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  opacity: 0.7;
  margin-top: 6px;
}
.controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 24px;
  padding: 8px 0;
}
.ctrl-btn {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--color-ink-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s var(--ease-out);
  padding: 4px;
}
.ctrl-btn:hover { color: var(--color-brand-deep); }
.ctrl-btn:active { transform: scale(0.9); }
.ctrl-btn svg { display: block; }
.play-btn {
  background: linear-gradient(135deg, var(--color-brand), var(--color-brand-deep));
  border: none;
  width: 56px; height: 56px;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  box-shadow: var(--shadow-button);
  transition: all 0.18s var(--ease-out);
}
.play-btn:hover { transform: scale(1.04); }
.play-btn:active { transform: scale(0.95); }
.volume-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: -4px;
}
.volume-row svg { color: var(--color-mute); flex-shrink: 0; }
input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  flex: 1;
  height: 4px;
  border-radius: 2px;
  background: var(--color-brand-tint);
  outline: none;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 16px; height: 16px;
  border-radius: 50%;
  background: var(--color-brand-mid);
  cursor: pointer;
  border: 2px solid white;
  box-shadow: 0 1px 4px rgba(0,0,0,0.1);
}
.genres {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.genre-tag {
  background: var(--color-surface-soft);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-pill);
  padding: 4px 14px;
  font-size: 12px;
  font-weight: 500;
  color: var(--color-ink-soft);
  cursor: pointer;
  transition: all 0.15s var(--ease-out);
  white-space: nowrap;
}
.genre-tag:hover { border-color: var(--color-brand); color: var(--color-brand-deep); }
.genre-tag.active {
  background: var(--color-brand-mist);
  border-color: var(--color-brand);
  color: var(--color-brand-deep);
  font-weight: 600;
}
.queue-info {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--color-mute);
  padding-top: 4px;
  border-top: 1px solid var(--color-border);
}
.history {
  max-height: 140px;
  overflow-y: auto;
  margin-top: -4px;
}
.history::-webkit-scrollbar { width: 4px; }
.history::-webkit-scrollbar-thumb { background: var(--color-brand-tint); border-radius: 2px; }
.hist-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 0;
  border-bottom: 1px solid var(--color-border);
  font-size: 12px;
}
.hist-item:last-child { border-bottom: none; }
.hist-item.now { font-weight: 600; color: var(--color-brand-deep); }
.hist-genre {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--color-mute);
  background: var(--color-surface-soft);
  padding: 2px 8px;
  border-radius: var(--radius-pill);
}
.status-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11px;
  color: var(--color-mute);
  padding-top: 12px;
  border-top: 1px solid var(--color-border);
}
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
.live-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--color-ok); animation: pulse 1.5s infinite; margin-right: 6px; }
.now-playing-empty {
  text-align: center;
  padding: 24px 0;
  color: var(--color-mute);
}
.now-playing-empty h3 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.now-playing-empty p { font-size: 12px; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>nubcat <span>radio</span></h1>
    <span class="badge" id="trackCount">0 tracks</span>
  </div>

  <!-- Now Playing -->
  <div class="now-playing" id="nowPlaying">
    <div class="np-genre" id="npGenre">—</div>
    <div class="np-title" id="npTitle">pick a genre</div>
    <div class="np-sub" id="npSub">select a genre below or hit play for all</div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="time-row"><span id="timeCurrent">0:00</span><span id="timeTotal">0:00</span></div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button class="ctrl-btn" id="prevBtn" title="previous" onclick="prev()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"/><line y1="4" x2="5" y1="4" x2="5" y2="20"/></svg>
    </button>
    <button class="play-btn" id="playBtn" onclick="togglePlay()">
      <svg id="playIcon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20 6 4"/></svg>
    </button>
    <button class="ctrl-btn" id="nextBtn" title="next" onclick="next()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="4" x2="19" y2="20"/></svg>
    </button>
  </div>

  <!-- Volume -->
  <div class="volume-row">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
    <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.7" oninput="setVolume(this.value)">
  </div>

  <!-- Genre filter -->
  <div class="genres" id="genreList">
    <span class="genre-tag active" data-genre="all" onclick="filterGenre('all')">🎲 all</span>
  </div>

  <!-- Queue info -->
  <div class="queue-info">
    <span id="queueStatus">shuffling all tracks</span>
    <span id="trackPosition">—</span>
  </div>

  <!-- History -->
  <div class="history" id="history"></div>

  <!-- Status -->
  <div class="status-bar">
    <span><span class="live-dot"></span>live from ~/nubcat-disco</span>
    <span id="statusTime"></span>
  </div>
</div>

<script>
const AUDIO = new Audio();
let STATE = { tracks: [], filtered: [], queue: [], current: null, playing: false, genre: 'all' };
let HISTORY = [];

async function init() {
  const r = await fetch('tracks.json?v=' + Date.now(), {cache: 'no-store'});
  if (!r.ok) { document.getElementById('trackCount').textContent = 'manifest error'; return; }
  const data = await r.json();
  STATE.tracks = data.tracks || [];
  if (STATE.tracks.length === 0) {
    document.getElementById('trackCount').textContent = 'no tracks found';
    document.getElementById('npSub').textContent = 'catalog empty — check tracks.json';
    return;
  }
  STATE.filtered = [...STATE.tracks];
  buildGenres(data.genres || []);
  shuffle();
  document.getElementById('trackCount').textContent = STATE.tracks.length + ' tracks';
  statusTime();
  setInterval(statusTime, 1000);

  AUDIO.addEventListener('timeupdate', updateProgress);
  AUDIO.addEventListener('ended', () => { trackEnded(); });
  AUDIO.addEventListener('loadedmetadata', () => {
    document.getElementById('timeTotal').textContent = fmtTime(AUDIO.duration);
  });
}

function buildGenres(genres) {
  const el = document.getElementById('genreList');
  for (const g of genres) {
    const tag = document.createElement('span');
    tag.className = 'genre-tag';
    tag.dataset.genre = g;
    tag.textContent = iconFor(g) + ' ' + g;
    tag.onclick = () => filterGenre(g);
    el.appendChild(tag);
  }
}

function iconFor(g) {
  const m = {
    'reggaeton': '🎵', 'drum-and-bass': '🔊', 'country': '🤠', 'synthwave': '🌆',
    'opera': '🎭', 'uk-drill': '🧊', 'disco': '🕺', 'k-pop': '💖', 'delta-blues': '🎸',
    'dubstep': '💥', 'jazz': '🎷', 'grunge': '🤘'
  };
  return m[g] || '🎵';
}

function shuffle() {
  let pool = STATE.genre === 'all' ? [...STATE.tracks] : STATE.filtered;
  // fisher-yates
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  STATE.queue = pool;
  STATE.current = -1;
  updateQueueInfo();
}

function filterGenre(genre) {
  STATE.genre = genre;
  document.querySelectorAll('.genre-tag').forEach(t => t.classList.toggle('active', t.dataset.genre === genre));
  if (genre === 'all') STATE.filtered = [...STATE.tracks];
  else STATE.filtered = STATE.tracks.filter(t => t.genre === genre);
  shuffle();
  STATE.playing = false;
  AUDIO.pause();
  document.getElementById('playIcon').innerHTML = '<polygon points="6 4 20 12 6 20 6 4"/>';
  // reset now playing
  document.getElementById('npGenre').textContent = '—';
  document.getElementById('npTitle').textContent = genre === 'all' ? 'pick a genre' : `filtered: ${genre}`;
  document.getElementById('npSub').textContent = `${STATE.filtered.length} tracks ready`;
  document.getElementById('progressFill').style.width = '0%';
  document.getElementById('timeCurrent').textContent = '0:00';
  document.getElementById('timeTotal').textContent = '0:00';
  document.getElementById('queueStatus').textContent = `shuffling ${STATE.filtered.length} tracks`;
  document.getElementById('trackPosition').textContent = '—';
}

function playTrack(idx) {
  if (idx < 0 || idx >= STATE.queue.length) { shuffle(); idx = 0; }
  STATE.current = idx;
  const t = STATE.queue[idx];
  AUDIO.src = `/api/stream/${t.file}`;
  AUDIO.play().then(() => { STATE.playing = true; document.getElementById('playIcon').innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>'; }).catch(() => {});
  // update display
  const g = t.genre;
  document.getElementById('npGenre').textContent = iconFor(g) + ' ' + g;
  document.getElementById('npTitle').textContent = t.file.replace('.mp3','').replace(/-/g,' ');
  document.getElementById('npSub').textContent = '#' + (t.num) + ' · ' + formatSize(t.size_kb);
  updateQueueInfo();
  addHistory(t);
}

function togglePlay() {
  if (STATE.queue.length === 0) return;
  if (STATE.current < 0) { playTrack(0); return; }
  if (STATE.playing) { AUDIO.pause(); STATE.playing = false; document.getElementById('playIcon').innerHTML = '<polygon points="6 4 20 12 6 20 6 4"/>'; }
  else { AUDIO.play().then(() => { STATE.playing = true; document.getElementById('playIcon').innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>'; }).catch(() => {}); }
}

function next() { playTrack(STATE.current + 1); }
function prev() { playTrack(STATE.current - 1); }

function trackEnded() { playTrack(STATE.current + 1); }

function updateProgress() {
  if (!AUDIO.duration) return;
  const pct = (AUDIO.currentTime / AUDIO.duration) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('timeCurrent').textContent = fmtTime(AUDIO.currentTime);
}

function setVolume(v) { AUDIO.volume = parseFloat(v); }

function updateQueueInfo() {
  const total = STATE.queue.length;
  const pos = STATE.current + 1;
  const remaining = total - pos;
  document.getElementById('trackPosition').textContent = pos > 0 ? `${pos}/${total} · ${remaining} left` : `—`;
  document.getElementById('queueStatus').textContent = STATE.genre === 'all' ? 'shuffling all tracks' : `shuffling ${STATE.filtered.length} ${STATE.genre} tracks`;
}

function addHistory(t) {
  HISTORY.unshift(t);
  if (HISTORY.length > 50) HISTORY.pop();
  renderHistory();
}

function renderHistory() {
  const el = document.getElementById('history');
  el.innerHTML = HISTORY.slice(0, 15).map((t, i) => `
    <div class="hist-item${i === 0 ? ' now' : ''}">
      <span>${i === 0 ? '▶ ' : ''}${t.file.replace('.mp3','').replace(/-/g,' ')}</span>
      <span class="hist-genre">${t.genre}</span>
    </div>
  `).join('');
}

function fmtTime(s) {
  if (!s || isNaN(s)) return '0:00';
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return m + ':' + (sec < 10 ? '0' : '') + sec;
}

function formatSize(kb) {
  if (kb > 1024) return (kb/1024).toFixed(1) + ' MB';
  return kb + ' KB';
}

function statusTime() {
  document.getElementById('statusTime').textContent = new Date().toLocaleTimeString();
}

init();
</script>
</body>
</html>
