<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#9ecdff">
<title>nubcat radio — live</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Poppins",system-ui,sans-serif;
  background: radial-gradient(900px 500px at 50% 0%, #b7d9fe 0%, transparent 55%),
              linear-gradient(180deg,#9ecdff 0%, #7eb6f5 100%);
  color:#1a3d6b; display:flex; align-items:center; justify-content:center;
  padding:16px; min-height:100dvh;
}
.card{
  width:100%; max-width:340px;
  background:#fff; border:1px solid rgba(26,61,107,.12);
  border-radius:22px; box-shadow:0 16px 40px rgba(26,61,107,.15);
  padding:28px 24px 22px; text-align:center;
}
.badge{
  display:inline-flex; align-items:center; gap:7px;
  font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase;
  color:#5a7aa0; background:#f2f7ff; border:1px solid rgba(26,61,107,.08);
  padding:5px 10px; border-radius:999px;
}
.dot{width:8px;height:8px;border-radius:50%;background:#e24b6a;animation:pl 1.4s infinite}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.45}}
h1{font-size:28px; font-weight:800; letter-spacing:-.03em; margin:14px 0 4px}
.sub{font-size:12px; color:#5a7aa0; min-height:16px; line-height:1.4}
.track{font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:#2f7ed8; margin-top:10px; min-height:14px}
.unmute{
  margin:22px auto 0; width:88px; height:88px; border-radius:50%; border:none;
  background:linear-gradient(135deg,#4d97f0,#2f7ed8); color:#fff;
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  box-shadow:0 10px 24px rgba(47,126,216,.35); transition:transform .15s, opacity .3s;
}
.unmute:hover{transform:scale(1.04)}
.unmute:active{transform:scale(.96)}
.label{font-size:12px; font-weight:600; color:#5a7aa0; margin-top:12px; transition:opacity .3s}
.count{font-size:11px; color:#8aa0c0; margin-top:14px}
.live{font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:#e24b6a; margin-top:8px; opacity:0; transition:opacity .3s}
</style>
</head>
<body>
<main class="card" aria-label="nubcat radio">
  <span class="badge"><span class="dot"></span><span id="listeners">— listening</span></span>
  <h1>nubcat radio</h1>
  <div class="sub" id="sub">live • true broadcast</div>
  <div class="track" id="track">&nbsp;</div>
  <div class="live" id="live">● live</div>
  <button class="unmute" id="btn" aria-label="tap to listen">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
  </button>
  <div class="label" id="label">tap to listen</div>
  <div class="count" id="countExtra">connecting…</div>
</main>
<audio id="audio" preload="none" crossorigin="anonymous"></audio>
<script>
const audio=document.getElementById('audio');
const els={
  listeners:document.getElementById('listeners'),
  sub:document.getElementById('sub'),
  track:document.getElementById('track'),
  btn:document.getElementById('btn'),
  label:document.getElementById('label'),
  extra:document.getElementById('countExtra'),
  live:document.getElementById('live')
};
let unlocked=false;
function updateListeners(n, streamN){
  const total = typeof streamN==='number' ? streamN : n;
  els.listeners.textContent = (total===1?'1 listening': total+' listening');
}
function setTrack(t){
  if(!t){ els.track.textContent='\u00a0'; els.sub.textContent='live • true broadcast'; return; }
  els.track.textContent = t.file.replace('.mp3','').replace(/-/g,' ');
  els.sub.textContent = t.genre.replace(/-/g,' ');
}
async function fetchNow(){
  try{
    const r=await fetch('/api/nowplaying?v='+Date.now(),{cache:'no-store'});
    const d=await r.json();
    if(typeof d.streamListeners==='number' || typeof d.listeners==='number') updateListeners(d.listeners, d.streamListeners);
    const b=d.broadcast;
    if(b && b.track) setTrack(b.track);
    else if(d.station && d.station.track) setTrack(d.station.track);
  }catch(e){}
}
fetchNow(); setInterval(fetchNow, 4000);
try{
  const es=new EventSource('/api/listeners');
  es.onmessage=e=>{
    try{
      const d=JSON.parse(e.data);
      if(typeof d.listeners==='number') updateListeners(d.listeners, d.broadcast?d.streamListeners:d.listeners);
      const b=d.broadcast;
      if(b && b.track) setTrack(b.track);
      else if(d.station && d.station.track) setTrack(d.station.track);
    }catch{}
  };
}catch(e){}

els.btn.onclick=()=>{
  if(unlocked) return;
  unlocked=true;
  audio.src='/stream?v='+Date.now();
  audio.crossOrigin='anonymous';
  audio.play().then(()=>{
    els.btn.style.opacity='0'; els.label.style.opacity='0';
    setTimeout(()=>{ els.btn.style.display='none'; els.label.style.display='none'; }, 300);
    els.live.style.opacity='1';
    els.extra.textContent='live stream • everyone hears the same';
  }).catch(err=>{
    unlocked=false;
    els.extra.textContent='tap again — browser blocked autoplay';
    console.log(err);
  });
};
audio.addEventListener('error', ()=>{
  if(unlocked){
    els.extra.textContent='reconnecting…';
    setTimeout(()=>{ audio.src='/stream?v='+Date.now(); audio.play().catch(()=>{}); }, 1500);
  }
});
audio.addEventListener('stalled', ()=>{
  if(unlocked) fetchNow();
});
</script>
</body>
</html>
