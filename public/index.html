<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#9ecdff">
<meta name="color-scheme" content="light">
<meta name="description" content="nubcat radio — shuffle through 50 nubcat tracks across 12 genres. live station, one tap play.">
<title>nubcat radio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
/* ——— tokens: Restrained, tinted neutrals, OKLCH ——— */
:root{
  --brand-soft: oklch(83% 0.08 245); /* #9ecdff */
  --brand-deep: oklch(55% 0.165 250); /* #2f7ed8 */
  --brand-mid: oklch(65% 0.14 250);
  --accent: oklch(82% 0.085 350); /* #ffc0d8 muted */
  --ink: oklch(28% 0.055 255); /* #1a3d6b */
  --ink-soft: oklch(45% 0.04 255);
  --muted: oklch(58% 0.03 255);
  --surface: oklch(99% 0.005 255);
  --surface-soft: oklch(97.5% 0.01 255);
  --border: oklch(93% 0.02 255);
  --ok: oklch(68% 0.13 155);
  --radius-sm: 10px; --radius-md: 14px; --radius-lg: 18px; --radius-xl: 28px; --radius-pill: 999px;
  --shadow-card: 0 12px 32px oklch(75% 0.06 250 / 0.12);
  --shadow-button: 0 8px 20px oklch(55% 0.165 250 / 0.28);
  --ease-out: cubic-bezier(0.22,1,0.36,1);
  --ease-spring: cubic-bezier(0.34,1.56,0.64,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scrollbar-gutter:stable}
body{
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  background: var(--brand-soft);
  background-image:
    radial-gradient(ellipse at 18% 0%, oklch(85% 0.08 350 / 0.28) 0%, transparent 55%),
    radial-gradient(ellipse at 88% 92%, oklch(78% 0.07 250 / 0.12) 0%, transparent 50%);
  color: var(--ink);
  min-height:100vh; min-height:100dvh;
  display:flex; align-items:center; justify-content:center;
  padding:20px 16px;
  -webkit-font-smoothing:antialiased;
}
button, input{font:inherit}
button:focus{outline:none}
button:focus-visible{outline:2px solid var(--brand-mid); outline-offset:2px}
a:focus-visible{outline:2px solid var(--brand-mid); outline-offset:2px}

/* layout */
.station{width:100%; max-width:560px; display:flex; flex-direction:column; gap:16px}
.listeners{
  display:flex; justify-content:center; align-items:center; gap:8px;
  font-size:0.9375rem; font-weight:600; letter-spacing:-0.01em; color:var(--ink);
}
.live-dot{width:10px;height:10px;border-radius:50%; background:oklch(62% 0.19 25); animation:pulse 1.6s infinite; flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(.88)}}
@media (prefers-reduced-motion:reduce){.live-dot{animation:none}}

/* card */
.card{
  background: var(--surface);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-card);
  border:1px solid var(--border);
  padding:28px 24px 22px;
  display:flex; flex-direction:column; gap:0;
}
.title-wrap{
  overflow:hidden; white-space:nowrap;
  margin:0 -4px 4px; padding:0 4px;
  mask-image: linear-gradient(to right, transparent 0, black 12px, black calc(100% - 12px), transparent 100%);
}
.title{
  display:inline-block;
  font-size: clamp(26px, 6.2vw, 36px);
  font-weight:800; line-height:1.1; letter-spacing:-0.03em;
  text-wrap: balance;
  padding-right: 48px;
}
.title.scroll{animation:marquee 14s linear infinite}
@keyframes marquee{0%{transform:translateX(22%)}100%{transform:translateX(-100%)}}
@media (prefers-reduced-motion:reduce){.title.scroll{animation:none; transform:none}}
.genre-line{
  font-size:0.8125rem; font-weight:700; letter-spacing:0.12em; text-transform:uppercase;
  color: var(--brand-deep);
  min-height:18px; margin-bottom:18px;
}
.genre-line:empty::before{content:"\00a0"}

/* progress */
.bar{height:5px; background:var(--border); border-radius:999px; overflow:hidden; margin:0 2px}
.fill{height:100%; width:0%; background:linear-gradient(90deg, var(--accent), var(--brand-mid)); transition: width .25s linear}
.times{display:flex; justify-content:space-between; font-size:0.8125rem; font-variant-numeric:tabular-nums; color:var(--muted); margin:8px 2px 20px}

/* controls */
.controls{display:flex; align-items:center; justify-content:center; gap:20px; margin-bottom:18px}
.side-btn{
  width:44px; height:44px; border-radius:50%;
  background: var(--surface-soft); border:1px solid var(--border);
  color:var(--ink-soft); cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition: background .15s var(--ease-out), color .15s var(--ease-out), transform .12s var(--ease-out);
}
.side-btn:hover{background:var(--surface); color:var(--brand-deep); border-color: oklch(88% 0.05 250)}
.side-btn:active{transform:scale(.96)}
.side-btn:disabled{opacity:.4; cursor:not-allowed}
.play{
  width:72px; height:72px; border-radius:50%; border:none; cursor:pointer;
  background: linear-gradient(135deg, var(--brand-mid), var(--brand-deep));
  color: var(--surface); box-shadow: var(--shadow-button);
  display:flex; align-items:center; justify-content:center;
  transition: transform .15s var(--ease-out), box-shadow .15s var(--ease-out), filter .15s var(--ease-out);
}
.play:hover{transform:scale(1.03); filter:brightness(1.04)}
.play:active{transform:scale(.96); box-shadow: 0 4px 12px oklch(55% 0.165 250 / 0.2)}
.play:disabled{opacity:.5; cursor:not-allowed; transform:none}

/* volume */
.volume-row{display:flex; align-items:center; gap:10px; margin-bottom:18px}
.volume-row label{font-size:0.75rem; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:var(--muted); white-space:nowrap}
.volume-row svg{color:var(--muted); flex-shrink:0}
input[type="range"]{
  -webkit-appearance:none; appearance:none;
  flex:1; height:4px; border-radius:999px;
  background: oklch(90% 0.03 250);
  outline:none;
}
input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none; width:18px; height:18px; border-radius:50%;
  background: var(--brand-mid); border:2px solid var(--surface);
  box-shadow: 0 1px 6px oklch(0% 0 0 / 0.12);
  cursor:pointer; transition: transform .12s var(--ease-out);
}
input[type="range"]::-webkit-slider-thumb:hover{transform:scale(1.08)}
input[type="range"]::-moz-range-thumb{
  width:18px; height:18px; border-radius:50%; border:2px solid var(--surface);
  background: var(--brand-mid); cursor:pointer;
}

/* genres */
.genres{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px}
.genre-tag{
  appearance:none; -webkit-appearance:none;
  background: var(--surface-soft); border:1px solid var(--border);
  border-radius: var(--radius-pill);
  padding:6px 14px;
  font-size:0.8125rem; font-weight:600; color:var(--ink-soft);
  cursor:pointer; white-space:nowrap;
  transition: all .15s var(--ease-out);
}
.genre-tag:hover{border-color: oklch(80% 0.08 250); color:var(--brand-deep); background: oklch(96% 0.02 250)}
.genre-tag.active{background: oklch(94% 0.04 250); border-color: var(--brand-mid); color:var(--brand-deep); font-weight:700}
.genre-tag:focus-visible{outline:2px solid var(--brand-mid); outline-offset:2px}

/* queue + history */
.meta-row{
  display:flex; justify-content:space-between; gap:12px;
  font-size:0.75rem; color:var(--muted);
  padding:10px 0 8px; border-top:1px solid var(--border);
  font-variant-numeric: tabular-nums;
}
.history{
  max-height:168px; overflow-y:auto; scrollbar-width:thin;
  scrollbar-color: var(--border) transparent;
  margin:0 -4px; padding:0 4px;
}
.history::-webkit-scrollbar{width:6px}
.history::-webkit-scrollbar-thumb{background: oklch(90% 0.03 250); border-radius:999px}
.hist-item{
  display:flex; justify-content:space-between; align-items:center; gap:12px;
  padding:8px 0; border-bottom:1px solid var(--border);
  font-size:0.8125rem; line-height:1.4;
}
.hist-item:last-child{border-bottom:none}
.hist-item.now{font-weight:700; color:var(--brand-deep)}
.hist-main{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0}
.hist-genre{
  font-size:0.6875rem; font-weight:700; letter-spacing:0.06em; text-transform:uppercase;
  color:var(--muted); background: var(--surface-soft);
  padding:3px 8px; border-radius:var(--radius-pill); flex-shrink:0;
}
.history-empty{padding:12px 0; text-align:center; font-size:0.8125rem; color:var(--muted)}

/* status */
.status{
  margin-top:12px; text-align:center;
  font-size:0.8125rem; color:var(--muted); min-height:18px;
}
.status.error{color: oklch(60% 0.15 25)}
.status.live{color: var(--ink-soft)}
.footer{
  text-align:center; font-size:0.6875rem; color: oklch(62% 0.03 250);
  letter-spacing:0.02em;
}
.footer a{color:var(--brand-deep); text-decoration:none; text-underline-offset: 2px}
.footer a:hover{text-decoration:underline}

/* skip link */
.skip{position:absolute; left:-9999px; top:auto; width:1px; height:1px; overflow:hidden}
.skip:focus{left:12px; top:12px; width:auto; height:auto; background:var(--surface); border:1px solid var(--border); padding:8px 12px; border-radius:var(--radius-sm); z-index:10}
</style>
</head>
<body>
<a class="skip" href="#player">Skip to player</a>
<main class="station" id="station">
  <div class="listeners" aria-live="polite" aria-atomic="true"><span class="live-dot" aria-hidden="true"></span><span id="listenerCount">—</span>&nbsp;listening</div>

  <section class="card" id="player" aria-label="nubcat radio player">
    <div class="title-wrap" aria-live="polite"><div class="title" id="title">nubcat radio</div></div>
    <div class="genre-line" id="genreLine" aria-live="polite">&nbsp;</div>

    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="playback progress"><div class="fill" id="fill"></div></div>
    <div class="times"><span id="tCur" aria-label="current time">0:00</span><span id="tTot" aria-label="total time">0:00</span></div>

    <div class="controls">
      <button class="side-btn" id="prevBtn" aria-label="previous track" onclick="prev()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="19 20 9 12 19 4"/><rect x="5" y="4" width="2" height="16" rx="0.5"/></svg>
      </button>
      <button class="play" id="playBtn" aria-label="play" onclick="togglePlay()">
        <svg id="icon" width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="7 4 19 12 7 20"/></svg>
      </button>
      <button class="side-btn" id="nextBtn" aria-label="next track" onclick="next()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="5 4 15 12 5 20"/><rect x="17" y="4" width="2" height="16" rx="0.5"/></svg>
      </button>
    </div>

    <div class="volume-row">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
      <label for="volumeSlider">volume</label>
      <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.75" aria-label="volume">
    </div>

    <div class="genres" id="genreList" role="group" aria-label="filter by genre">
      <button class="genre-tag active" data-genre="all" onclick="filterGenre('all')" aria-pressed="true">all</button>
    </div>

    <div class="meta-row"><span id="queueStatus">—</span><span id="trackPosition">—</span></div>
    <div class="history" id="history" aria-label="play history"></div>

    <div class="status live" id="status" aria-live="polite">tap play to tune in</div>
  </section>

  <div class="footer">50 tracks · 12 genres · <span id="footerCount">—</span> in catalog · live via SSE</div>
</main>

<script>
const audio = new Audio();
audio.preload = "metadata";
let tracks = [], queue = [], pos = -1, playing = false;
let STATE = { genre: 'all', filtered: [] };
let HISTORY = [];
const els = {
  title: document.getElementById('title'),
  genreLine: document.getElementById('genreLine'),
  fill: document.getElementById('fill'),
  tCur: document.getElementById('tCur'),
  tTot: document.getElementById('tTot'),
  status: document.getElementById('status'),
  queueStatus: document.getElementById('queueStatus'),
  trackPosition: document.getElementById('trackPosition'),
  history: document.getElementById('history'),
  listenerCount: document.getElementById('listenerCount'),
  footerCount: document.getElementById('footerCount'),
  icon: document.getElementById('icon'),
  playBtn: document.getElementById('playBtn'),
  bar: document.querySelector('.bar'),
};

// ——— SSE listeners ———
try{
  const es = new EventSource('/api/listeners');
  es.onmessage = e => { els.listenerCount.textContent = e.data; };
  es.onerror = () => { els.listenerCount.textContent = '—'; };
}catch(_e){}

// ——— load catalog ———
async function init(){
  // volume
  const savedVol = localStorage.getItem('nubcat:vol');
  if(savedVol !== null) { audio.volume = parseFloat(savedVol); document.getElementById('volumeSlider').value = audio.volume; }
  else { audio.volume = 0.75; }
  document.getElementById('volumeSlider').addEventListener('input', e => {
    audio.volume = parseFloat(e.target.value);
    localStorage.setItem('nubcat:vol', String(audio.volume));
  });

  try{
    const r = await fetch('tracks.json?v=' + Date.now(), {cache:'no-store'});
    if(!r.ok) throw new Error('manifest ' + r.status);
    const d = await r.json();
    tracks = Array.isArray(d.tracks) ? d.tracks : [];
    const genres = Array.isArray(d.genres) ? d.genres : [...new Set(tracks.map(t=>t.genre))].sort();
    if(!tracks.length){ setStatus('catalog empty — check tracks.json', true); return; }
    STATE.filtered = [...tracks];
    buildGenres(genres);
    reshuffle();
    els.footerCount.textContent = tracks.length;
    updateQueueInfo();
    setStatus('tap play to tune in');
    // expose station clock sync for shared-listening feel without hijacking manual control
    syncToStationClock();
    setInterval(syncToStationClock, 8000);
  }catch(err){
    setStatus('catalog error — ' + (err.message || 'fetch failed'), true);
  }

  audio.addEventListener('timeupdate', onTime);
  audio.addEventListener('loadedmetadata', () => { els.tTot.textContent = fmt(audio.duration); syncBar(); });
  audio.addEventListener('ended', () => next());
  audio.addEventListener('error', () => setStatus('stream error — retrying next track', true));
  audio.addEventListener('play', () => { playing = true; icon(true); setStatus('live'); });
  audio.addEventListener('pause', () => { if(!audio.ended){ playing=false; icon(false); setStatus('paused'); }});

  // keyboard: space toggles, arrows next/prev
  document.addEventListener('keydown', e => {
    if(e.target instanceof HTMLInputElement || e.target instanceof HTMLButtonElement) return;
    if(e.code === 'Space'){ e.preventDefault(); togglePlay(); }
    if(e.code === 'ArrowRight'){ e.preventDefault(); next(); }
    if(e.code === 'ArrowLeft'){ e.preventDefault(); prev(); }
  });
}

function buildGenres(genres){
  const el = document.getElementById('genreList');
  // keep the 'all' button, add rest
  for(const g of genres){
    const btn = document.createElement('button');
    btn.className = 'genre-tag';
    btn.dataset.genre = g;
    btn.textContent = g;
    btn.setAttribute('aria-pressed','false');
    btn.onclick = () => filterGenre(g);
    el.appendChild(btn);
  }
}

function reshuffle(){
  const pool = STATE.genre === 'all' ? [...tracks] : [...STATE.filtered];
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  queue = pool;
  pos = -1;
}

function shuffle(){ reshuffle(); }

function stationIndexAndOffset(){
  const now = Date.now()/1000;
  const slot = Math.floor(now / 180) % (queue.length || 1);
  const offset = now % 180;
  return {slot, offset};
}
function syncToStationClock(){
  if(playing || !queue.length) return;
  const {slot} = stationIndexAndOffset();
  if(pos < 0) setNowPlaying(slot, false);
}

// ——— playback ———
function audioSrcFor(file){
  // dual-path: relative for gh-pages (docs/audio), absolute /audio for express range streaming.
  // Prefer relative first (works in both when served from root), fallback is handled by error retry.
  return 'audio/' + file;
}

function setTitle(text){
  els.title.textContent = text;
  els.title.classList.remove('scroll');
  requestAnimationFrame(() => {
    const wrap = els.title.parentElement;
    if(els.title.scrollWidth > wrap.clientWidth + 8) els.title.classList.add('scroll');
  });
}

function setNowPlaying(idx, autoplay){
  if(!queue.length) return;
  // wrap
  if(idx < 0) idx = queue.length - 1;
  if(idx >= queue.length){ reshuffle(); idx = 0; }
  pos = idx;
  const t = queue[pos];
  if(!t) return;
  const display = t.file.replace('.mp3','').replace(/-/g,' ');
  setTitle(display);
  els.genreLine.textContent = t.genre.replace(/-/g,' ');
  // progress reset
  els.fill.style.width = '0%';
  els.tCur.textContent = '0:00';
  els.tTot.textContent = '0:00';
  els.bar.setAttribute('aria-valuenow','0');
  // source with dual-path fallback on error
  const trySrc = audioSrcFor(t.file);
  audio.src = trySrc;
  audio.load();
  updateQueueInfo();
  addHistory(t);
  if(autoplay) {
    audio.play().catch(() => {
      // fallback: try absolute /audio path (express) if relative failed (e.g. docs/ on gh-pages without docs/audio)
      if(!trySrc.startsWith('/audio/')){
        audio.src = '/audio/' + t.file;
        audio.play().catch(err => setStatus('stream error — mp3s not hosted at this path', true));
      } else {
        setStatus('tap play to start', true);
      }
    });
  }
}

function filterGenre(genre){
  STATE.genre = genre;
  document.querySelectorAll('.genre-tag').forEach(b => {
    const on = b.dataset.genre === genre;
    b.classList.toggle('active', on);
    b.setAttribute('aria-pressed', String(on));
  });
  if(genre === 'all') STATE.filtered = [...tracks];
  else STATE.filtered = tracks.filter(t => t.genre === genre);
  const wasPlaying = playing;
  audio.pause();
  playing = false; icon(false);
  reshuffle();
  els.fill.style.width = '0%';
  els.tCur.textContent = '0:00'; els.tTot.textContent = '0:00';
  els.bar.setAttribute('aria-valuenow','0');
  // reset display
  els.genreLine.textContent = genre === 'all' ? 'all genres' : genre.replace(/-/g,' ');
  setTitle(genre === 'all' ? 'nubcat radio' : genre.replace(/-/g,' ') + ' — ' + STATE.filtered.length + ' tracks');
  updateQueueInfo();
  setStatus(STATE.filtered.length ? (wasPlaying ? 'switched genre — tap play' : 'tap play to tune in') : 'no tracks in genre', false);
  // keep history visible but queue reset
}

function togglePlay(){
  if(!tracks.length) return;
  if(pos < 0) {
    setNowPlaying(Math.floor(Math.random()*queue.length), true);
    return;
  }
  if(audio.paused){
    audio.play().then(()=>{ playing=true; icon(true); setStatus('live'); }).catch(()=> setStatus('stream error — mp3s not hosted at this path', true));
  } else {
    audio.pause();
  }
}
function next(){
  if(!queue.length) return;
  const autoplay = playing || audio.src !== '';
  const n = pos + 1;
  setNowPlaying(n, autoplay);
  if(autoplay && audio.paused) audio.play().catch(()=>{});
}
function prev(){
  if(!queue.length) return;
  const autoplay = playing || audio.src !== '';
  const p = pos - 1;
  setNowPlaying(p, autoplay);
  if(autoplay && audio.paused) audio.play().catch(()=>{});
}

function icon(isPlaying){
  const btn = els.playBtn;
  if(isPlaying){
    els.icon.innerHTML = '<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>';
    btn.setAttribute('aria-label','pause');
  } else {
    els.icon.innerHTML = '<polygon points="7 4 19 12 7 20"/>';
    btn.setAttribute('aria-label','play');
  }
}
function setStatus(text, isError){
  els.status.textContent = text;
  els.status.className = isError ? 'status error' : (playing ? 'status live' : 'status');
}

function onTime(){
  if(!audio.duration) return;
  const pct = (audio.currentTime / audio.duration) * 100;
  els.fill.style.width = pct + '%';
  els.bar.setAttribute('aria-valuenow', String(Math.round(pct)));
  els.tCur.textContent = fmt(audio.currentTime);
}
function syncBar(){
  if(!audio.duration) return;
  const pct = (audio.currentTime / audio.duration) * 100;
  els.fill.style.width = pct + '%';
  els.bar.setAttribute('aria-valuenow', String(Math.round(pct)));
}
function fmt(s){
  if(!s || isNaN(s)) return '0:00';
  const m = Math.floor(s/60), sec = Math.floor(s%60);
  return m + ':' + (sec < 10 ? '0' : '') + sec;
}
function updateQueueInfo(){
  const total = queue.length;
  const cur = pos >= 0 ? pos + 1 : 0;
  const remaining = total - cur;
  els.trackPosition.textContent = cur ? cur + '/' + total + ' · ' + remaining + ' left' : '—';
  els.queueStatus.textContent = STATE.genre === 'all' ? 'shuffling all tracks' : 'shuffling ' + STATE.filtered.length + ' ' + STATE.genre + ' tracks';
}
function addHistory(t){
  HISTORY.unshift(t);
  if(HISTORY.length > 50) HISTORY.pop();
  renderHistory();
}
function renderHistory(){
  if(!HISTORY.length){ els.history.innerHTML = '<div class="history-empty">history appears after you play</div>'; return; }
  els.history.innerHTML = HISTORY.slice(0,12).map((t,i) =>
    '<div class="hist-item' + (i===0 ? ' now' : '') + '"><span class="hist-main">' + (i===0 ? '▶ ' : '') + t.file.replace('.mp3','').replace(/-/g,' ') + '</span><span class="hist-genre">' + t.genre + '</span></div>'
  ).join('');
}
renderHistory();
init();

// expose for gate checks
window.__nubcat = { filterGenre, shuffle, reshuffle, get tracks(){return tracks}, get queue(){return queue} };
</script>
</body>
</html>
