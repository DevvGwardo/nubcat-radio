<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#9ecdff">
<title>nubcat radio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Calibri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --brand-soft: #9ecdff;
  --brand-deep: #2f7ed8;
  --ink: #1a3d6b;
  --surface: #ffffff;
  --border: #e5edfa;
}
body {
  font-family: Calibri, "Segoe UI", Carlito, sans-serif;
  background: var(--brand-soft);
  background-image: radial-gradient(ellipse at 20% 0%, rgba(255,192,216,0.25) 0%, transparent 50%);
  color: var(--ink);
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.station {
  width: 100%;
  max-width: 520px;
}
/* listeners pill */
.listeners {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  margin-bottom: 18px;
  font-size: 17px;
  font-weight: 600;
  color: var(--ink);
}
.live-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: #e74c3c;
  animation: pulse 1.6s infinite;
}
@keyframes pulse { 0%,100% { opacity:1; transform:scale(1);} 50% { opacity:.5; transform:scale(.85);} }

/* player card */
.card {
  background: var(--surface);
  border-radius: 28px;
  box-shadow: 0 12px 32px rgba(108,178,255,0.18);
  padding: 36px 30px 30px;
  text-align: center;
}

/* big scrolling title */
.title-wrap {
  overflow: hidden;
  white-space: nowrap;
  margin-bottom: 6px;
}
.title {
  display: inline-block;
  font-size: clamp(26px, 7vw, 40px);
  font-weight: 700;
  line-height: 1.15;
  padding-right: 80px; /* gap before loop repeats */
}
.title.scroll { animation: marquee 12s linear infinite; }
@keyframes marquee {
  0%   { transform: translateX(100%); }
  100% { transform: translateX(-100%); }
}
.genre-line {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--brand-deep);
  margin-bottom: 22px;
  min-height: 18px;
}

/* progress */
.bar { height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; margin: 0 4px 8px; }
.fill { height: 100%; width: 0%; background: linear-gradient(90deg,#ffc0d8,#6bb1ff); transition: width .3s linear; }
.times { display: flex; justify-content: space-between; font-size: 13px; color: #6c7a93; margin: 0 4px 24px; }

/* controls */
.controls { display: flex; align-items: center; justify-content: center; gap: 34px; }
.side-btn {
  background: none; border: none; cursor: pointer;
  color: var(--ink); opacity: .55;
  padding: 6px; transition: all .15s ease;
}
.side-btn:hover { opacity: 1; transform: scale(1.08); }
.play {
  width: 78px; height: 78px; border-radius: 50%;
  border: none; cursor: pointer;
  background: linear-gradient(135deg,#6bb1ff,#2f7ed8);
  color: #fff;
  box-shadow: 0 10px 24px rgba(47,126,216,.35);
  display: flex; align-items: center; justify-content: center;
  transition: transform .15s ease;
}
.play:active { transform: scale(.94); }

.status {
  margin-top: 22px;
  font-size: 14px;
  color: #6c7a93;
  min-height: 17px;
}
</style>
</head>
<body>
<div class="station">
  <div class="listeners"><span class="live-dot"></span><span id="listenerCount">—</span> listening</div>

  <div class="card">
    <div class="title-wrap"><div class="title" id="title">nubcat radio</div></div>
    <div class="genre-line" id="genreLine">&nbsp;</div>

    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="times"><span id="tCur">0:00</span><span id="tTot">0:00</span></div>

    <div class="controls">
      <button class="side-btn" onclick="prev()" aria-label="previous">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><polygon points="19 20 9 12 19 4"/><rect x="5" y="4" width="2" height="16"/></svg>
      </button>
      <button class="play" onclick="togglePlay()" aria-label="play/pause">
        <svg id="icon" width="34" height="34" viewBox="0 0 24 24" fill="currentColor"><polygon points="7 4 21 12 7 20"/></svg>
      </button>
      <button class="side-btn" onclick="next()" aria-label="next">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 4 15 12 5 20"/><rect x="17" y="4" width="2" height="16"/></svg>
      </button>
    </div>

    <div class="status" id="status">tap play to tune in</div>
  </div>
</div>

<script>
const audio = new Audio();
let tracks = [], queue = [], pos = -1, playing = false;

// ---- listeners via SSE ----
const es = new EventSource('/api/listeners');
es.onmessage = e => {
  document.getElementById('listenerCount').textContent = e.data;
};

// ---- load catalog ----
async function init() {
  const r = await fetch('tracks.json?v=' + Date.now(), {cache:'no-store'});
  const d = await r.json();
  tracks = d.tracks || [];
  if (!tracks.length) { setStatus('catalog empty'); return; }
  reshuffle();
  // everyone hears the same "station": position derived from server epoch time
  syncToStationClock();
  setInterval(syncToStationClock, 5000);
}
function reshuffle(){
  queue = [...tracks];
  for (let i=queue.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [queue[i],queue[j]]=[queue[j],queue[i]]; }
}
// shared clock: all listeners on the same schedule (offset = seconds since hour start)
function stationIndexAndOffset(){
  const now = Date.now()/1000;
  const slot = Math.floor(now / 180) % queue.length;         // 3-minute slots
  const offsetIntoSlot = now % 180;
  return {slot, offsetIntoSlot};
}
function syncToStationClock(){
  if (playing) return; // user-driven mode keeps manual control
  const {slot} = stationIndexAndOffset();
  setNowPlaying(slot);
}

function setTitle(t){
  const el = document.getElementById('title');
  el.textContent = t;
  el.classList.remove('scroll');
  // marquee only when overflowing
  requestAnimationFrame(() => {
    if (el.scrollWidth > el.parentElement.clientWidth) el.classList.add('scroll');
  });
}
function setNowPlaying(idx){
  pos = idx;
  const t = queue[idx];
  if (!t) return;
  setTitle(t.file.replace('.mp3','').replace(/-/g,' '));
  document.getElementById('genreLine').textContent = t.genre.replace(/-/g,' ');
  audio.src = 'audio/' + t.file;
}
function togglePlay(){
  if (!tracks.length) return;
  if (pos < 0) setNowPlaying(Math.floor(Math.random()*queue.length));
  if (audio.paused) {
    audio.play().then(()=>{ playing=true; icon(true); setStatus('live'); }).catch(err=>setStatus('stream error — mp3s not hosted yet'));
  } else { audio.pause(); playing=false; icon(false); setStatus('paused'); }
}
function next(){ if(!queue.length)return; setNowPlaying((pos+1)%queue.length); if(playing) audio.play(); }
function prev(){ if(!queue.length)return; setNowPlaying((pos-1+queue.length)%queue.length); if(playing) audio.play(); }
function icon(p){ document.getElementById('icon').innerHTML = p ? '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>' : '<polygon points="7 4 21 12 7 20"/>'; }
function setStatus(s){ document.getElementById('status').textContent = s; }

audio.addEventListener('ended', next);
audio.addEventListener('timeupdate', ()=>{
  if (!audio.duration) return;
  document.getElementById('fill').style.width = (audio.currentTime/audio.duration*100)+'%';
  document.getElementById('tCur').textContent = fmt(audio.currentTime);
});
audio.addEventListener('loadedmetadata', ()=>{ document.getElementById('tTot').textContent = fmt(audio.duration); });
function fmt(s){ if(!s||isNaN(s))return'0:00'; const m=Math.floor(s/60),x=Math.floor(s%60); return m+':'+(x<10?'0':'')+x; }

init();
</script>
</body>
</html>
